<!DOCTYPE html>
<html lang="en">
<head>
  <title>variable</title>
</head>
<body>
  <script>
    let welcomeMessage=('hello world');
    console.log(welcomeMessage);
    let a = 5;
    let b = 5;
    let c = a + 5;
    console.log(c);
    // short hand
    a+=6;
    console.log(a)
    b-=2;
    console.log(b)
    //increase every time by 1. it used in loop
    a++;
    console.log(a);
    

  </script>
