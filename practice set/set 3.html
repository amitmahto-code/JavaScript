  <script>
    let age = 4;
    let gender = 'female';
    let finaldiscount;
    let ticketprice = 100; 
    if (gender === 'female'){
      finaldiscount = (ticketprice / 100)*50;
      ticketprice = finaldiscount;
    }

    if (age <= 5){
      ticketprice = 0;
    }else if (age >=8){
      ticketprice = ticketprice / 2;
    }else if( age > 65){
      finaldiscount = (ticketprice /100)*30;
      ticketprice = finaldiscount;
    }
    console.log(ticketprice);
  </script>
