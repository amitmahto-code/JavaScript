<!DOCTYPE html>
<html lang="en">
<head>
    <title>Set 6</title>
    <style>
        #my-button{
            height: 50px;
            width: 150px;
            font-size: 25px;
            border-radius: 5px;
            
        }
        .odd{
            background-color: chocolate;
        }
        .even{
            background-color: yellowgreen;
        }
    </style>
</head>
<body>  
    <h3 id="greeting"></h3>
    <button id="my-button"  onclick=" press()"></button>
    <script>
        function geeting(personName = 'Dear'){
            let time = new Date();
            time = time.getHours();
            let handing = document.querySelector('#greeting');
        

            if(time < 12){
                handing.innerHTML=`Good morning ${personName}`;
            }else if (time >= 12){
                handing.innerHTML=`Good afternoon ${personName}`;

            }else if(time > 21){
                handing.innerHTML=`Good night ${personName}`;
            }
        }  
        geeting();
        let number = localStorage.getItem('number') || 0;
        function press(){

            number++;
            localStorage.setItem('number', number)
            updatebutton();
        }
        function updatebutton(){
            let buttenPress = document.querySelector('#my-button');
            if(number % 2===0){
                buttenPress.classList.remove('odd');
                buttenPress.classList.add('even');
                
            }else{
                buttenPress.classList.remove('even');
                buttenPress.classList.add('odd');

            }
            
            buttenPress.innerText=`count ${number}`;
        }
        updatebutton();
        

    </script>
</body>
</html>
