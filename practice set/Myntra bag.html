<!DOCTYPE html>
<html lang="en">
<head>
  <title>Myntra bag</title>
  <link rel="stylesheet" href="myntrabag.css">
</head>
<body>
  <button id="addtobag" onclick="quntitysummery++; document.querySelector('#summary').innerText = `Your Bag has ${quntitysummery} items`    
  ">Add to bag</button>  
  <button id="wishlist" onclick="quntitysummery--; document.querySelector('#summary').innerText = `Your Bag has ${quntitysummery} items`    
  ">Move to Wishlist</button>  
  <button id="Add" onclick="quntitysummery+=2; document.querySelector('#summary').innerText = `Your Bag has ${quntitysummery} items`    
  ">Add 1+1 sale items</button> 
  <h1 id="summary"></h1> 
  <script >
    let quntitysummery = 0;
    document.querySelector('#summary').innerText = `Your Bag has ${quntitysummery} items`    
  </script>
</body>
</html>
