<!DOCTYPE html>
<html lang="en">
<head>
  <title>if-else</title>
</head>
<body>
  
  <script>
    let age = 21;
    console.log("checking age limit for driving");
    if(age > 70){
      console.log("ask someone who can drop you");
    }
    else if(age > 18){
      console.log("You can drive");
    }else{
      console.log("use bicycle ");
    }
  </script>
</body>
</html>
