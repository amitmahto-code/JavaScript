<!DOCTYPE html>
<html lang="en">
<head>
  <title>Cricket Game</title>
  <style>
    body{
      text-align: center ;
    }
  </style>
</head>
<body>
  <h1>Bat Ball Stump Game</h1>
  <div>
    <button onclick="
      let computerChoic = generatComputerChoice();      
      let resultmsg=getresult(computerChoic , userchoice = 'Bat');
      display('Bat',computerChoic,resultmsg);">Bat</button>

    <button  onclick="
      computerChoic = generatComputerChoice();
      resultmsg=getresult(computerChoic , userchoice = 'Ball');
      display('Ball',computerChoic,resultmsg);">Ball</button>
    <button  onclick="
      computerChoic = generatComputerChoice();      
      resultmsg=getresult(computerChoic , userchoice = 'Stump');
      display('Stump',computerChoic,resultmsg);">Stump</button>
  </div>
  <script>
    let score = {
      win: 0,
      loss: 0,
      tie: 0,
      displayScore : function(){
           return `win: ${score.win}, Loss: ${score.loss}, tie: ${score.tie}`
      },
    };
    
    function generatComputerChoice(){
      let randomNumber =  Math.random() * 3;
      if( randomNumber > 0 && randomNumber <= 1){
        return 'Bat';
      }else if (randomNumber > 1 && randomNumber <= 2){
        return 'Ball';
      }else{
        return 'Stump';
      }
    }
    function getresult(computerChoic , userchoice){      
      if(userchoice === 'Bat'){
        if (computerChoic === 'Bat'){
          score.tie ++;
          return `It's a tie`;
        }else if(computerChoic === 'Ball'){
          score.win ++;
          return 'uesr won';
        }else if (computerChoic === 'Stump'){
          score.loss++;
          return 'Computer won';        
        }
      }else if(userchoice === 'Ball'){
         if (computerChoic === 'Bat'){
           score.loss++;
            return `Computer won`;
          }else if(computerChoic === 'Ball'){
            score.tie ++;
            return `Its's a tie`;
          }else if (computerChoic === 'Stump'){
            score.win ++;
            return 'User won';
          }
      }else {
        if (computerChoic === 'Bat'){
          score.win ++;  
          return `user won`;
        }else if(computerChoic === 'Ball'){
          score.loss++;
          return 'Computer won';
        }else if (computerChoic === 'Stump'){
          score.tie ++;
          return `It's a tie`;
       }      
      }
    }
    function display(userchoice,computerChoic,resultmsg){
      alert(`User Choice ${userchoice}. Computer Choice ${computerChoic}.
      ${resultmsg}
     ${score.displayScore()}`);

    }
  </script>
</body>
</html>
