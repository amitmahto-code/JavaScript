 <!DOCTYPE html>
 <html lang="en">
 <head>
  <title>Object</title>
 </head>
 <body>
  <script>
    let product = {
      company : 'Mango',
      price : 851,
      item_name : 'T-shirt',
    };
    console.log(product);

    // first way to access object
    console.log(product.item_name);
    console.log(product.price);
    console.log(product.company);
    product.company = 'Banana'
    console.log(product); 

    // secomd way to access object
    let propartyName = 'item_name';
    console.log(product['company']);
    console.log(product[propartyName]);

    delete product.company;
    console.log(product); 

    // nested object
    let productDetails = {
      company : 'Mango',
      price : 851,
      item_name : 'T-shirt',
      display_price: function(){
        console.log(`Price of the product is $${this.price}`)
      },
    }
    productDetails.display_price();

    // Autoboxing
    console.log('My name is amit'.toUpperCase());
    console.log('My name is  amit'.replace('amit','Mahto Amit'));

    //object references 
    let num = 10;
    let num1 = num;
    console.log(`num1=${num}, num2=${num1}`);
    num = 25;
    console.log(`num1=${num}, num2=${num1}`);

    let a = {a:10 };
    let b = a;
    console.log(`${a.a},${b.a}`);
    a.a=24
    console.log(`${a.a},${b.a}`);

  </script>
 </body>
 </html>
