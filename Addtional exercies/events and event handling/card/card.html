<!DOCTYPE html>
<html lang="en">
<head>
    <title>card</title>
    <style>

        #main{
            margin: 30px;
            width: 100%;
            height: 100%;
        }
        input{
            display: block;
            margin: 5px;
        }
        .card{
            margin:10px ;
            padding: 5px;
            display: inline-block;
            border: 5px solid;
            border-radius: 10px;
            max-width: 300px;
        }
        .profile{
            border: 2px solid white;
            border-radius: 50%;
            height: 50px;
            width: 50px;
            overflow: hidden;
        }
        .img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            
        }
        .card h3 {
            margin: 2px 0;
        }
        .card h5 {
            margin: 2px 0;
        }
        .card p {
            margin: 4px 0;
        }
    </style>
</head>
<body>
    <div id="main">
        <form action="" class="inp">
            <input type="text" placeholder="Profile pic">
            <input type="text" placeholder="Name">
            <input type="text" placeholder="occipution">
            <input type="text" placeholder="info">
            <input type="submit">
        </form>

    </div>
    
    <script src="card.js"></script>
</body>
</html>
