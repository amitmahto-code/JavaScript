<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        .glass-card{
            height: 89px;
            width: 211px;
            border: 2px solid black;
            border-radius: 16px;
            background-color: rgba(0, 0, 0, 0.232);
        }
        h2{
            text-align: center;
            font-size: 22px;
            margin: 11px;
            color: rgba(0, 0, 0, 0.918);

        }
        .progres-container{
            height: 11px;
            width: 174px;
            border-radius: 10px;
            border: 2px solid black;
            margin-left: 13px;
            
        }
        .progress-bar{
            height: 100%;
            width: 20%;
            border-radius: 11px;
            background-color: rebeccapurple;
        }
        .percent{
            font-size: 15px;
            text-align: center;
            margin: 2px;
            color: rgba(0, 0, 0, 0.641);
        }
    </style>
</head>
<body>
 
    <div class="glass-card">
        <h2>Downloading...</h2>
        <div class="progres-container">
            <div class="progress-bar" id="progressBar"></div>
