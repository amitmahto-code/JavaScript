<!DOCTYPE html>
<html lang="en">
<head>
    <title>DOM</title>
    <style>
     .completed{
        text-decoration: line-through;
     }
    </style>
</head>
<body>
    <!-- Beginner DOM Problems -->
    <!-- 1.Change text -->
    <h1 id="title">Hello</h1>
    <!-- 2.change text and background color -->
    <p id="para">Learning DOM</p>

    <div id="box">Hello</div>

    <!-- button click Event -->
    <button id="btn">Click Me</button>

    <!-- Problem: Toggle Text -->
    <p id="text">OFF</p>
    <button id="toggleBtn">Toggle</button><br><br>

    <!-- problem: Add List Items -->
    <input type="text" id="inp">
    <button id="addBtn">Add</button>
    <ul id="list"></ul>
    
    <!-- //Live Character Counter -->
    <textarea id="text1"></textarea>
    <p id="count">0</p>

    <select id="colors">

        <option value="white">White</option>

        <option value="black">Black</option>

        <option value="blue">Blue</option>

    </select>

    <form id="form">

        <input type="text" id="name" >

        <button id="sbtn">Submit</button>

    </form>

    <!--Event Delegation -->
    <ul id="list1">
        <li>Apple</li>
        <li>Mango</li>
    </ul>

    

    <script src="DOM.js"></script>
    
</body>
</html>
